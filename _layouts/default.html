<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'es' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <div class="header-container">
      <a href="{{ '/' | relative_url }}" class="site-title">
        <span class="cooking-emoji">🍳</span> {{ site.title | default: 'Recetario' }}
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}" class="nav-link">Inicio</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. Hecho con ❤️ y Jekyll.</p>
      <p class="footer-subtitle">Tu recetario de cocina personal</p>
    </div>
  </footer class="site-footer">

</body>
</html>
